# NFL pipeline: monthly full rebuild, and the heartbeat that keeps the schedules alive.
#
# Owner's guide: NFL/03-pipeline/AUTOMATION.md. Contract: NFL/CONTRACTS.md section 8.
#
# On the 1st of every month: `run --seasons all` re-reads every season in the window, so values
# nflverse back-corrects in finished seasons reach NFL/04-data. No resolve step: the pipeline itself
# returns SKIP (exit 3) when nothing changed. HOLD or error opens or comments on this workflow's
# rolling issue (label `nfl-pipeline-alert-monthly`); only a real PUBLISH of this workflow closes it.
#
# Heartbeat. GitHub disables every scheduled workflow of a public repository after 60 days without
# repository activity ("Disabling and enabling a workflow", docs.github.com). The off-season (March to
# August) has no weekly publish, and a month without nflverse corrections makes no data commit. So
# after every run (on the 1st, and a heartbeat-only fire on the 16th) this workflow looks at the newest
# commit on main; if it is HEARTBEAT_AFTER_DAYS or more old, it pushes one empty commit (same tree as
# its parent: no file changes). With fires about 15 days apart, the longest gap between commits stays
# under 21 + 16 = 37 days, and under 21 + 31 = 52 days even if one fire is dropped. In season, and
# whenever the owner commits, no heartbeat is needed and none is made.

name: nfl-pipeline-monthly

on:
  schedule:
    - cron: "23 11 1 * *"    # 1st of each month, 11:23 UTC: full rebuild, then the heartbeat check
    - cron: "37 11 16 * *"   # 16th of each month, 11:37 UTC: heartbeat check only (HEARTBEAT_CRON)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute and check everything, publish nothing"
        type: boolean
        default: false
      workbook_only:
        description: "Only rebuild and republish the Excel workbook from the data already on main (no pipeline run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nfl-pipeline-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: NFL/03-pipeline

env:
  PYTHONUNBUFFERED: "1"
  DATA_PATH: NFL/04-data
  ALERT_LABEL: nfl-pipeline-alert-monthly
  WORKBOOK_TAG: nfl-workbook
  WORKBOOK_ASSET: NFL-Analysis.xlsx
  TABLE_PLAYERS_ASSET: NFL-PlayerGames.csv
  TABLE_SEASONS_ASSET: NFL-SeasonTotals.csv
  REFRESH_ASSET: NFL-Analysis-Refresh.xlsx
  # The refresh workbook (NFL-Analysis-Refresh.xlsx) is built and published only while this is "true". It stays "false"
  # until the owner has opened a copy in desktop Excel and it worked (AUTOMATION.md, "The refresh workbook switch").
  # Keep the value the same in nfl-pipeline-weekly.yml and nfl-pipeline-monthly.yml.
  PUBLISH_REFRESH_WORKBOOK: "false"
  HEARTBEAT_CRON: "37 11 16 * *"
  HEARTBEAT_AFTER_DAYS: "21"
  GUIDE_URL: https://github.com/wes-blue/sports-analysis/blob/main/NFL/03-pipeline/AUTOMATION.md

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # commit NFL/04-data, heartbeat commit
      issues: write     # rolling alert issue
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false   # the token is handed to the commit and heartbeat steps only

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The pipeline uses the standard library only: no pip install.

      - name: Run pipeline (all seasons)
        id: outcome
        env:
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_WORKBOOK_ONLY: ${{ inputs.workbook_only }}
          REF: ${{ github.ref }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER: ${{ github.event_name }}-monthly
          RUN_LOG: ${{ runner.temp }}/nflpipe-run.log
          ALERT_DETAILS: ${{ runner.temp }}/nfl-alert-details.md
        run: |
          set +e
          dry_run="${IN_DRY_RUN:-false}"
          if [[ "$REF" != "refs/heads/main" ]]; then
            dry_run=true
            echo "::notice title=Dry run::started on ${REF#refs/heads/}, not main: checks only, nothing is committed"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          : > "$ALERT_DETAILS"
          if [[ -n "$EVENT_SCHEDULE" && "$EVENT_SCHEDULE" == "$HEARTBEAT_CRON" ]]; then
            echo "outcome=HEARTBEAT" >> "$GITHUB_OUTPUT"
            echo "::notice title=HEARTBEAT::mid-month fire: no pipeline run, heartbeat check only"
            echo "### NFL pipeline monthly: HEARTBEAT (mid-month check only)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${IN_WORKBOOK_ONLY:-false}" == "true" && "$REF" != "refs/heads/main" ]]; then
            # Publishing is allowed from main only, so this request cannot be carried out. Say so, in red.
            msg="workbook_only was started on ${REF#refs/heads/}, not main, so NOTHING was rebuilt and nothing was published. Start it again with Use workflow from set to main."
            echo "outcome=ERROR" >> "$GITHUB_OUTPUT"
            echo "::error title=Workbook only: nothing done::${msg}"
            echo "workbook_only: ${msg}" >> "$ALERT_DETAILS"
            { echo "### NFL pipeline monthly: ERROR"; echo ""; echo "- ${msg}"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${IN_WORKBOOK_ONLY:-false}" == "true" ]]; then
            echo "outcome=WORKBOOK" >> "$GITHUB_OUTPUT"
            echo "::notice title=Workbook only::no pipeline run; the workbook is rebuilt from the data on main"
            echo "### NFL pipeline monthly: WORKBOOK (rebuild by hand, no pipeline run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf ../.work/last-run
          args=(run --seasons all --trigger "$TRIGGER")
          [[ "$dry_run" == "true" ]] && args+=(--dry-run)
          python -m nflpipe "${args[@]}" 2>&1 | tee "$RUN_LOG"
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) outcome=PUBLISH
               if [[ "$dry_run" == "true" ]]; then
                 echo "::notice title=PUBLISH (dry run)::checked only, nothing was committed"
               else
                 echo "::notice title=PUBLISH::new data published"
               fi ;;
            3) outcome=SKIP;    echo "::notice title=SKIP::nothing changed upstream" ;;
            4) outcome=HOLD;    echo "::error title=HOLD::a blocking gate failed; nothing was published" ;;
            *) outcome=ERROR;   echo "::error title=ERROR::python -m nflpipe run exited $rc; nothing was published" ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            if [[ -f ../.work/last-run/run_summary.csv ]]; then
              python - ../.work/last-run <<'PY'
          import csv, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          for row in csv.DictReader((report / "run_summary.csv").open(encoding="utf-8")):
              if row["key"] in ("detail", "notes") and row["value"]:
                  print(f"{row['key']}: {row['value']}")
          gates = report / "checks" / "gates.csv"
          if gates.is_file():
              for row in csv.DictReader(gates.open(encoding="utf-8")):
                  if row.get("result") in ("FAIL", "WARN"):
                      print(f"{row['gate_id']} {row['result']} ({row['severity']}): {row['detail']}")
          PY
            elif [[ "$outcome" == "ERROR" ]]; then
              echo "last lines of the pipeline log:"
              tail -n 25 "$RUN_LOG"
            fi
          } 2>&1 | cut -c1-400 | head -n 40 | sed 's/```/'"'''"'/g' > "$ALERT_DETAILS"
          {
            echo "### NFL pipeline monthly: $outcome"
            echo ""
            echo "- run exit code: $rc"
            echo "- dry run: $dry_run"
            if [[ -s "$ALERT_DETAILS" ]]; then
              echo ""
              echo '```text'
              cat "$ALERT_DETAILS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Keep the gate report (run artifact, 30 days)
        if: ${{ !cancelled() && (steps.outcome.outputs.outcome == 'PUBLISH' || steps.outcome.outputs.outcome == 'HOLD' || steps.outcome.outputs.outcome == 'ERROR') }}
        continue-on-error: true   # a convenience copy: it must never turn a good run red (a re-run has the same run id, so the attempt is in the name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: NFL/.work/last-run/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit 04-data
        id: commit
        if: steps.outcome.outputs.outcome == 'PUBLISH' && steps.outcome.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The token is used by this step's fetch and push only and is never written to .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="nfl-pipeline: publish NFL/04-data (monthly, run ${GITHUB_RUN_ID})"
          git add -- "$DATA_PATH"
          if git diff --cached --quiet; then
            echo "::notice::NFL/04-data unchanged; nothing to commit"
            exit 0
          fi
          git commit -q -m "$msg" -m "$RUN_URL"
          for attempt in 1 2 3; do
            if g push origin "HEAD:refs/heads/${BRANCH}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt); re-applying NFL/04-data on top of origin/${BRANCH}"
            keep="$(mktemp -d)"
            cp -a "$DATA_PATH/." "$keep/"
            g fetch --depth=1 origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
            rm -rf "$DATA_PATH"
            mkdir -p "$DATA_PATH"
            cp -a "$keep/." "$DATA_PATH/"
            git add -- "$DATA_PATH"
            if git diff --cached --quiet; then
              echo "::notice::origin already has this NFL/04-data"
              exit 0
            fi
            git commit -q -m "$msg" -m "$RUN_URL"
            sleep $((attempt * 10))
          done
          echo "::error::could not push NFL/04-data after 3 attempts"
          exit 1

      # ---- The finished workbook and tables (CONTRACTS.md section 13.5). Not committed to git: release assets. ----
      # Up to four assets on the release: NFL-Analysis.xlsx (the finished workbook), NFL-PlayerGames.csv and
      # NFL-SeasonTotals.csv (the same two tables as plain files), and, only while PUBLISH_REFRESH_WORKBOOK is
      # "true", NFL-Analysis-Refresh.xlsx (a data-free workbook that refreshes from the two CSV files in Excel).
      # One build, one swap, one key. With the switch "false" the refresh workbook is neither built nor uploaded,
      # "missing" and the swap cover the other three, and a copy already on the release is left alone.
      # Runs after a PUBLISH and its data commit, after a SKIP (cheap: reads only, when the release already
      # holds the finished assets built from the published data, the current workbook design and the current
      # tables design), or when asked by hand (workbook_only, which also rebuilds the tables). Never on a
      # dry run or off main. A failure in any asset turns the run red and the alert issue opens; the data
      # commit above stays.
      # No asset is deleted before every new one is on the release: each new file is uploaded under a
      # temporary name (NFL-Analysis.next.xlsx, NFL-PlayerGames.next.csv, ...), all of them are checked, and
      # only then do the delete and rename pairs run back to back. Whatever fails earlier, the links keep
      # serving the old files.
      - name: Decide whether to build the workbook
        id: wbcheck
        if: (steps.outcome.outputs.outcome == 'PUBLISH' || steps.outcome.outputs.outcome == 'SKIP' || steps.outcome.outputs.outcome == 'WORKBOOK') && steps.outcome.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: "0"
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          ALERT_DETAILS: ${{ runner.temp }}/nfl-alert-details.md
        run: |
          set +e
          out() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          stop() {
            echo "::error title=Workbook::$1"
            echo "workbook: $1" >> "$ALERT_DETAILS"
            echo "- workbook: FAILED. $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          err="$(mktemp)"
          oneline() { head -c 300 "$1" | tr '\r\n' '  '; }
          [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" || "$PUBLISH_REFRESH_WORKBOOK" == "false" ]] \
            || stop "PUBLISH_REFRESH_WORKBOOK must be \"true\" or \"false\""
          # retry COMMAND...: up to three tries, 5 s and 10 s apart. Prints the result of the first try that
          # works; the error text of the last one stays in $err. A read that keeps failing is never "missing".
          retry() {
            local n tmp
            tmp="$(mktemp)"
            for n in 1 2 3; do
              if "$@" >"$tmp" 2>"$err"; then cat "$tmp"; return 0; fi
              [[ "$n" -lt 3 ]] && sleep $((n * 5))
            done
            return 1
          }
          # A run that waited in the queue was started from an older commit. The workbook is built from the
          # newest NFL/04-data on main, so an older run can never publish older data over newer.
          fetched=false
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin main 2>"$err"; then fetched=true; break; fi
            [[ "$n" -lt 3 ]] && sleep $((n * 5))
          done
          [[ "$fetched" == "true" ]] || stop "could not fetch the latest NFL/04-data from main: $(oneline "$err")"
          rm -rf ../04-data
          git checkout -q FETCH_HEAD -- ../04-data 2>"$err" || stop "could not check out the latest NFL/04-data: $(oneline "$err")"
          status=../04-data/status.csv
          run_id="$(awk -F, '$1=="run_id"{print $2; exit}' "$status" 2>/dev/null)"
          version="$(awk -F, '$1=="pipeline_version"{print $2; exit}' "$status" 2>/dev/null)"
          [[ -n "$run_id" && -n "$version" ]] || stop "NFL/04-data/status.csv has no run_id or pipeline_version"
          # The workbook design version and the tables design version are read from the exporter's source, not imported.
          design="$(sed -n 's/^WORKBOOK_VERSION = "\([0-9A-Za-z._-]*\)".*/\1/p' nflpipe/export_xlsx.py 2>/dev/null | head -n 1)"
          [[ -n "$design" ]] || stop "could not read WORKBOOK_VERSION from nflpipe/export_xlsx.py"
          tables="$(sed -n 's/^TABLES_VERSION = "\([0-9A-Za-z._-]*\)".*/\1/p' nflpipe/export_xlsx.py 2>/dev/null | head -n 1)"
          [[ -n "$tables" ]] || stop "could not read TABLES_VERSION from nflpipe/export_xlsx.py"
          for v in "$run_id" "$version" "$design" "$tables"; do
            [[ "$v" =~ ^[0-9A-Za-z._-]+$ ]] || stop "run_id, pipeline_version, the workbook design version or the tables design version has unexpected characters"
          done
          # A new key whenever the data, the pipeline, the workbook's design or the tables' design changes.
          key="${run_id}|${version}|${design}|${tables}"
          have_release=false; have_asset=false; current=false; missing=""; leftover=""
          rel_expr='.[] | select(.tag_name=="'"$WORKBOOK_TAG"'") | "\(.id) \(.draft)"'
          rows="$(retry gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq "$rel_expr")" \
            || stop "could not list the releases: $(oneline "$err")"
          case "$(grep -c . <<< "$rows")" in
            0) echo "no release $WORKBOOK_TAG yet" ;;
            1) [[ "$rows" =~ ^[0-9]+[[:space:]]false$ ]] \
                 || stop "release $WORKBOOK_TAG is a draft: publish it or delete it on the Releases page (a draft has no public download address)"
               have_release=true; rid="${rows%% *}" ;;
            *) stop "more than one release carries the tag $WORKBOOK_TAG: delete the extra ones on the Releases page" ;;
          esac
          if [[ "$have_release" == "true" ]]; then
            # One read: state, size and name of every asset. Only a finished asset counts as present: GitHub can leave
            # an empty one (state "starter") after a failed upload. Every name counts for the temporary-asset check.
            rows_a="$(retry gh api "repos/${GH_REPO}/releases/${rid}" --jq '.assets[] | "\(.state) \(.size) \(.name)"')" \
              || stop "could not read the assets of the release: $(oneline "$err")"
            names="$(awk '$1=="uploaded" && $2>0 {print $3}' <<< "$rows_a")"
            allnames="$(awk '{print $3}' <<< "$rows_a")"
            # Every asset that is being published must be there (three while the refresh workbook is held back, four
            # when it is published). The first run after the tables were added finds the workbook only. A refresh
            # workbook that is on the release while the switch is "false" is neither required nor touched.
            required=("$WORKBOOK_ASSET" "$TABLE_PLAYERS_ASSET" "$TABLE_SEASONS_ASSET")
            [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" ]] && required+=("$REFRESH_ASSET")
            for a in "${required[@]}"; do
              grep -qxF "$a" <<< "$names" || missing="${missing:+${missing}, }${a}"
            done
            # A temporary asset (NFL-Analysis.next.xlsx, ...) is left over from a run that died. The publish removes it first.
            for a in "$WORKBOOK_ASSET" "$TABLE_PLAYERS_ASSET" "$TABLE_SEASONS_ASSET" "$REFRESH_ASSET"; do
              n="$(printf '%s.next.%s' "${a%.*}" "${a##*.}")"
              grep -qxF "$n" <<< "$allnames" && leftover="${leftover:+${leftover}, }${n}"
            done
            if [[ -z "$missing" ]]; then
              have_asset=true
              body="$(retry gh api "repos/${GH_REPO}/releases/${rid}" --jq '.body // ""')" \
                || stop "could not read the release notes: $(oneline "$err")"
              grep -qF "nfl-workbook-key: ${key} " <<< "$body" && current=true
            fi
          fi
          if [[ "$OUTCOME" == "PUBLISH" ]]; then
            build=true;  reason="new data was published (run ${run_id})"
          elif [[ "$OUTCOME" == "WORKBOOK" ]]; then
            build=true;  reason="a rebuild was requested by hand"
          elif [[ "$have_release" != "true" ]]; then
            build=true;  reason="there is no ${WORKBOOK_TAG} release yet"
          elif [[ "$have_asset" != "true" ]]; then
            build=true;  reason="the release has no finished ${missing} (an upload did not finish, or the asset is new)"
          elif [[ "$current" != "true" ]]; then
            build=true;  reason="the files on the release were not built from the published data and the current workbook and tables designs (key ${key})"
          elif [[ -n "$leftover" ]]; then
            build=true;  reason="a temporary asset is left over from an earlier run (${leftover}); the publish removes it"
          else
            build=false; reason="the ${#required[@]} files on the release already hold the published data (run ${run_id}, workbook design ${design}, tables design ${tables})"
          fi
          out "build=$build" "release_exists=$have_release" "key=$key"
          echo "- workbook: build=${build}; ${reason}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Workbook::build=${build}; ${reason}"

      - name: Build the workbook
        id: wbbuild
        if: steps.wbcheck.outputs.build == 'true'
        timeout-minutes: 20
        env:
          WORKBOOK_DIR: ../.work/workbook
          WORKBOOK_MIN_BYTES: "1000000"   # the real file is about 8 MB (3.001: about 38 MB); anything this small is a broken export
          PLAYERS_MIN_BYTES: "1000000"    # the real CSV is about 38 MB
          PLAYERS_MIN_LINES: "1000"       # and has about 180,000 lines
          SEASONS_MIN_BYTES: "100000"     # the real CSV is about 1.8 MB
          SEASONS_MIN_LINES: "100"        # and has about 24,000 lines
          REFRESH_MIN_BYTES: "5000"       # the real file is about 14 KB (no data)
          ALERT_DETAILS: ${{ runner.temp }}/nfl-alert-details.md
          EXPORT_LOG: ${{ runner.temp }}/nflpipe-export.log
        run: |
          set +e
          file="$WORKBOOK_DIR/$WORKBOOK_ASSET"
          players="$WORKBOOK_DIR/$TABLE_PLAYERS_ASSET"
          seasons="$WORKBOOK_DIR/$TABLE_SEASONS_ASSET"
          refresh="$WORKBOOK_DIR/$REFRESH_ASSET"
          stop() {
            rm -f "$file" "$players" "$seasons" "$refresh"
            echo "::error title=Workbook::$1"
            { echo "workbook: $1"; [[ -f "$EXPORT_LOG" ]] && tail -n 10 "$EXPORT_LOG" | sed 's/```/'"'''"'/g'; } 2>/dev/null | cut -c1-300 >> "$ALERT_DETAILS"
            echo "- workbook: FAILED to build. $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          rm -rf "$WORKBOOK_DIR"; mkdir -p "$WORKBOOK_DIR"
          # One pass writes the workbook and the two table files, so they cannot differ.
          python -m nflpipe export --data-dir ../04-data --out "$file" --tables-dir "$WORKBOOK_DIR" 2>&1 | tee "$EXPORT_LOG"
          rc=${PIPESTATUS[0]}
          [[ "$rc" -eq 0 ]] || stop "python -m nflpipe export exited ${rc}; the workbook and the tables were not built and nothing was uploaded"
          if [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" ]]; then
            python -m nflpipe refresh-workbook --out "$refresh" 2>&1 | tee -a "$EXPORT_LOG"
            rc=${PIPESTATUS[0]}
            [[ "$rc" -eq 0 ]] || stop "python -m nflpipe refresh-workbook exited ${rc}; the refresh workbook was not built and nothing was uploaded"
          fi
          # Sanity checks before anything is uploaded: a zip whose every member reads back (testzip checks
          # the checksums) and that holds a workbook, and a size that cannot be a truncated file.
          readable_xlsx() {
            python -I - "$1" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              if z.testzip() is not None or "xl/workbook.xml" not in z.namelist():
                  sys.exit(1)
          PY
          }
          readable_xlsx "$file" || stop "the exported file is not a readable Excel workbook; nothing was uploaded"
          size="$(stat -c %s "$file")"
          [[ "$size" -ge "$WORKBOOK_MIN_BYTES" ]] || stop "the exported file is only ${size} bytes (at least ${WORKBOOK_MIN_BYTES} expected); nothing was uploaded"
          rsize="none (not published)"
          if [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" ]]; then
            readable_xlsx "$refresh" || stop "the refresh workbook is not a readable Excel workbook; nothing was uploaded"
            rsize="$(stat -c %s "$refresh")"
            [[ "$rsize" -ge "$REFRESH_MIN_BYTES" ]] || stop "the refresh workbook is only ${rsize} bytes (at least ${REFRESH_MIN_BYTES} expected); nothing was uploaded"
            rsize="${rsize} bytes"
          fi
          # The two table files: present, not empty, a header that starts with "season," (no byte-order mark),
          # and a size and a line count that a truncated file cannot reach.
          check_table() {   # check_table FILE MIN_BYTES MIN_LINES
            local f="$1" bytes lines
            [[ -s "$f" ]] || stop "$(basename "$f") is missing or empty; nothing was uploaded"
            [[ "$(head -n 1 "$f" | cut -c1-7)" == "season," ]] || stop "$(basename "$f") does not start with the header season,...; nothing was uploaded"
            bytes="$(stat -c %s "$f")"; lines="$(wc -l < "$f")"
            [[ "$bytes" -ge "$2" ]] || stop "$(basename "$f") is only ${bytes} bytes (at least $2 expected); nothing was uploaded"
            [[ "$lines" -ge "$3" ]] || stop "$(basename "$f") has only ${lines} lines (at least $3 expected); nothing was uploaded"
            echo "- workbook: built $(basename "$f"), ${bytes} bytes, ${lines} lines" >> "$GITHUB_STEP_SUMMARY"
          }
          check_table "$players" "$PLAYERS_MIN_BYTES" "$PLAYERS_MIN_LINES"
          check_table "$seasons" "$SEASONS_MIN_BYTES" "$SEASONS_MIN_LINES"
          echo "- workbook: built, ${size} bytes; refresh workbook ${rsize}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the workbook (release nfl-workbook)
        id: wbpublish
        if: steps.wbcheck.outputs.build == 'true'
        timeout-minutes: 30
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EXISTS: ${{ steps.wbcheck.outputs.release_exists }}
          WORKBOOK_KEY: ${{ steps.wbcheck.outputs.key }}
          WORKBOOK_DIR: NFL/.work/workbook
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_DETAILS: ${{ runner.temp }}/nfl-alert-details.md
          NOTES_FILE: ${{ runner.temp }}/workbook-notes.md
        run: |
          set +e
          stop() {
            echo "::error title=Workbook::$1"
            echo "workbook: $1" >> "$ALERT_DETAILS"
            echo "- workbook: FAILED to publish. $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          err="$(mktemp)"
          oneline() { head -c 300 "$1" | tr '\r\n' '  '; }
          [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" || "$PUBLISH_REFRESH_WORKBOOK" == "false" ]] \
            || stop "PUBLISH_REFRESH_WORKBOOK must be \"true\" or \"false\""
          retry() {   # as in "Decide whether to build the workbook"
            local n tmp
            tmp="$(mktemp)"
            for n in 1 2 3; do
              if "$@" >"$tmp" 2>"$err"; then cat "$tmp"; return 0; fi
              [[ "$n" -lt 3 ]] && sleep $((n * 5))
            done
            return 1
          }
          status=NFL/04-data/status.csv
          val() { awk -F, -v k="$1" '$1==k{print $2; exit}' "$status" | tr -d '\r'; }
          base="${GITHUB_SERVER_URL}/${GH_REPO}/releases/download/${WORKBOOK_TAG}"
          api="repos/${GH_REPO}/releases"
          # assets: what this run publishes (three, or four when the refresh workbook is switched on).
          # all_assets: every name this workflow owns; only the temporary files of all four are ever cleaned up.
          all_assets=("$WORKBOOK_ASSET" "$TABLE_PLAYERS_ASSET" "$TABLE_SEASONS_ASSET" "$REFRESH_ASSET")
          assets=("$WORKBOOK_ASSET" "$TABLE_PLAYERS_ASSET" "$TABLE_SEASONS_ASSET")
          refresh_line=""
          if [[ "$PUBLISH_REFRESH_WORKBOOK" == "true" ]]; then
            assets+=("$REFRESH_ASSET")
            refresh_line=$'\n'"- Refresh workbook (no data; refreshes from the two CSV files in Excel): ${base}/${REFRESH_ASSET}"
          fi
          # The temporary name of each asset (GitHub refuses two assets with one name): NFL-Analysis.next.xlsx, ...
          nextname() { printf '%s.next.%s' "${1%.*}" "${1##*.}"; }
          declare -A size newid
          for a in "${assets[@]}"; do size[$a]="$(stat -c %s "$WORKBOOK_DIR/$a")"; done
          # The release notes say which data the files hold. The key line is what the next run compares
          # (see "Decide whether to build the workbook"); it is written only after every upload and link worked.
          cat > "$NOTES_FILE" <<NOTES
          Latest NFL fantasy-football workbook and tables. Values only: the workbook has nothing to refresh in Excel.

          - Finished workbook: ${base}/${WORKBOOK_ASSET}
          - PlayerGames table (CSV): ${base}/${TABLE_PLAYERS_ASSET}
          - SeasonTotals table (CSV): ${base}/${TABLE_SEASONS_ASSET}${refresh_line}

          - Data through: season $(val latest_season), week $(val latest_week) ($(val latest_season_type))
          - Data run id: $(val run_id)
          - Data generated (UTC): $(val generated_utc)
          - Pipeline version: $(val pipeline_version)
          - Checks: $(val gates_pass) passed, $(val gates_warn) warned, $(val gates_fail) failed
          - Built by: ${RUN_URL}

          Data: nflverse, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/), modified. See DATA-LICENSE.md in the repository.
          This is not a software release: the files under this tag are replaced on every publish.

          <!-- nfl-workbook-key: ${WORKBOOK_KEY} -->
          NOTES
          # 1. The release. A call that failed on the network may still have created it, so look before trying again.
          rel_expr='.[] | select(.tag_name=="'"$WORKBOOK_TAG"'") | "\(.id) \(.draft)"'
          if [[ "$RELEASE_EXISTS" != "true" ]]; then
            created=false
            cerr="$(mktemp)"
            for attempt in 1 2 3; do
              # Tag at the commit this run built from; marked a pre-release and never "Latest", so it does not pose as a software release.
              if gh release create "$WORKBOOK_TAG" --target "$(git rev-parse HEAD)" --prerelease --latest=false \
                   --title "NFL workbook (always the latest)" \
                   --notes "The workbook is being uploaded. This text is replaced when the upload finishes." 2>"$cerr"; then
                created=true; break
              fi
              echo "::warning::release creation failed (attempt $attempt): $(oneline "$cerr")"
              if [[ -n "$(retry gh api --paginate "${api}?per_page=100" --jq "$rel_expr")" ]]; then created=true; break; fi
              sleep $((attempt * 10))
            done
            [[ "$created" == "true" ]] || stop "could not create the release ${WORKBOOK_TAG}: $(oneline "$cerr")"
          fi
          # 2. Its id. A draft is not a published release: it has no download address, so stop rather than build on it.
          rows=""
          for attempt in 1 2 3 4; do
            rows="$(retry gh api --paginate "${api}?per_page=100" --jq "$rel_expr")" || stop "could not list the releases: $(oneline "$err")"
            [[ -n "$rows" ]] && break
            sleep $((attempt * 3))
          done
          [[ -n "$rows" ]] || stop "the release ${WORKBOOK_TAG} cannot be found"
          [[ "$(grep -c . <<< "$rows")" == "1" ]] || stop "more than one release carries the tag ${WORKBOOK_TAG}"
          [[ "$rows" =~ ^[0-9]+[[:space:]]false$ ]] || stop "release ${WORKBOOK_TAG} is a draft: publish it or delete it on the Releases page"
          rid="${rows%% *}"
          asset_ids() {   # asset_ids NAME [jq test]: the ids of the assets with this name
            retry gh api "${api}/${rid}" --jq ".assets[] | select(.name==\"$1\"${2:+ and $2}) | .id"
          }
          drop_assets() {   # delete every asset with this name, whatever its state (none is fine: a new asset has no old one)
            local ids id
            ids="$(asset_ids "$1")" || return 1
            for id in $ids; do
              retry gh api -X DELETE "${api}/assets/${id}" >/dev/null || return 1
            done
          }
          drop_all_next() { local x; for x in "${all_assets[@]}"; do drop_assets "$(nextname "$x")" >/dev/null 2>&1; done; }
          # 3. A temporary asset left by a run that died is removed first, for all four names (also the refresh
          #    workbook's while it is switched off). Nothing live has a temporary name, so no live asset is touched.
          for a in "${all_assets[@]}"; do
            drop_assets "$(nextname "$a")" || stop "could not remove the leftover $(nextname "$a"); no asset already on the release was touched: $(oneline "$err")"
          done
          # 3b. Upload every file under its temporary name. A leftover of a failed earlier try is removed first.
          #    There is no --clobber: no live asset has a temporary name, so this can never touch one.
          stage="$(mktemp -d)"
          upload_next() {   # upload_next TEMPORARY-NAME
            drop_assets "$1" || return 1
            gh release upload "$WORKBOOK_TAG" "$stage/$1" 2>"$err"
          }
          for a in "${assets[@]}"; do
            n="$(nextname "$a")"; cp "$WORKBOOK_DIR/$a" "$stage/$n"
            uploaded=false
            for attempt in 1 2 3; do
              if upload_next "$n"; then uploaded=true; break; fi
              echo "::warning::upload of ${a} failed (attempt $attempt): $(oneline "$err")"
              sleep $((attempt * 10))
            done
            if [[ "$uploaded" != "true" ]]; then
              drop_all_next
              stop "could not upload the new ${a} after 3 attempts; no asset already on the release was touched; the built files are in this run's workbook-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} artifact for 7 days"
            fi
          done
          # 4. Verify EVERY new file (finished, the right size) before any live asset is touched.
          for a in "${assets[@]}"; do
            id="$(asset_ids "$(nextname "$a")" ".state==\"uploaded\" and .size==${size[$a]}")"
            if [[ -z "$id" || "$id" == *[[:space:]]* ]]; then
              drop_all_next
              stop "the upload finished but the new ${a} is not on the release as one complete asset; no asset already on the release was touched"
            fi
            newid[$a]="$id"
          done
          # 5. The swaps, back to back. For each asset the old file goes (this opens the short window in which its link
          #    answers "not found") and the new one takes the stable name (which closes it). Should the rename be refused,
          #    the new file is uploaded again under the stable name (nothing is left to overwrite). A failure is noted and
          #    the other assets are still swapped, so the files do not stay half old and half new longer than needed.
          bad=""
          for a in "${assets[@]}"; do
            n="$(nextname "$a")"
            if ! drop_assets "$a"; then
              # The reply to a delete can be lost although the server did it (the retry then finds nothing and fails).
              # Look again: if the old file is gone, the delete is done.
              left="$(asset_ids "$a")" || left="?"
              if [[ -n "$left" ]]; then
                bad+="could not remove the old ${a}; it was left in place and the new file is on the release as ${n}. "
                continue
              fi
              echo "::warning::the reply to the delete of ${a} was lost, but the old file is gone; going on with the rename"
            fi
            renamed=false
            for attempt in 1 2 3 4 5; do
              if gh api -X PATCH "${api}/assets/${newid[$a]}" -f name="$a" >/dev/null 2>"$err"; then renamed=true; break; fi
              # A lost reply: the rename may have happened. If the new file already has the stable name, it is done.
              if [[ "$(asset_ids "$a")" == "${newid[$a]}" ]]; then renamed=true; echo "::warning::the reply to the rename of ${n} was lost, but ${a} is in place"; break; fi
              sleep 2
            done
            if [[ "$renamed" != "true" ]]; then
              echo "::warning::could not rename ${n} to ${a} ($(oneline "$err")); uploading it again under that name"
              fallback=false
              for attempt in 1 2 3; do
                if gh release upload "$WORKBOOK_TAG" "$WORKBOOK_DIR/$a" --clobber 2>"$err"; then fallback=true; break; fi
                sleep $((attempt * 10))
              done
              if [[ "$fallback" != "true" ]]; then
                bad+="the new ${a} is on the release as ${n} but could not be renamed to ${a}, and uploading it again failed ($(oneline "$err")); that link answers not found until the next run puts it back. "
                continue
              fi
              drop_assets "$n" >/dev/null 2>&1 || echo "::warning::could not remove the temporary asset ${n}; the next run removes it"
            fi
          done
          [[ -z "$bad" ]] || stop "${bad}The release notes still carry the old key, so the next run builds everything again"
          # 6. Ask for each public address the way the owner's browser does. A 404 here means the file is not
          #    served (a draft, an immutable-release rule, a wrong name), whatever the API said.
          #    Worst case, if no address ever answers: per asset 5 requests x 20 s = 100 s, plus the pauses between
          #    them 5 + 10 + 15 + 20 = 50 s (none after the last), so 150 s; four assets 600 s = 10 minutes, a third
          #    of this step's 30. A request for one byte (-r 0-0) does not download the file, so 20 s is ample.
          for a in "${assets[@]}"; do
            code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl -sL --max-time 20 -r 0-0 -o /dev/null -w '%{http_code}' "${base}/${a}")"
              [[ "$code" == "200" || "$code" == "206" ]] && break
              [[ "$attempt" -lt 5 ]] && sleep $((attempt * 5))
            done
            [[ "$code" == "200" || "$code" == "206" ]] || bad+="${a} is on the release but ${base}/${a} answers ${code:-nothing}. "
          done
          [[ -z "$bad" ]] || stop "${bad}The release notes still carry the old key, so the next run builds everything again"
          # 7. Only now do the notes claim the new data (the key line is what makes the next run skip).
          edited=false
          for attempt in 1 2 3; do
            if gh release edit "$WORKBOOK_TAG" --notes-file "$NOTES_FILE" 2>"$err"; then edited=true; break; fi
            sleep $((attempt * 5))
          done
          [[ "$edited" == "true" ]] || stop "the files were uploaded and the links work, but the release notes could not be updated ($(oneline "$err")); the next run rebuilds them"
          for a in "${assets[@]}"; do
            echo "- workbook: published at ${base}/${a}" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Workbook::published ${base}/${a}"
          done

      - name: Keep the workbook (run artifact, 7 days)
        if: ${{ !cancelled() && steps.wbbuild.outcome == 'success' }}
        continue-on-error: true   # a convenience copy: it must never turn a good run red
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbook-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            NFL/.work/workbook/NFL-Analysis.xlsx
            NFL/.work/workbook/NFL-PlayerGames.csv
            NFL/.work/workbook/NFL-SeasonTotals.csv
            NFL/.work/workbook/NFL-Analysis-Refresh.xlsx
          if-no-files-found: ignore
          compression-level: 6   # the CSV files compress to about an eighth; the workbooks are zip data already
          retention-days: 7

      - name: Heartbeat (keep the schedules alive)
        id: heartbeat
        # Runs after HOLD and ERROR too: a broken pipeline must not also let GitHub switch the schedules off.
        if: ${{ !cancelled() && steps.outcome.outputs.dry_run != 'true' && github.ref == 'refs/heads/main' }}
        working-directory: ${{ github.workspace }}
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() { git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          msg="nfl-pipeline: heartbeat (no file changes; keeps the scheduled workflows enabled)"
          for attempt in 1 2 3; do
            g fetch -q --depth=1 origin "$BRANCH"
            head="$(git rev-parse FETCH_HEAD)"
            age_days=$(( ($(date +%s) - $(git log -1 --format=%ct "$head")) / 86400 ))
            if (( age_days < HEARTBEAT_AFTER_DAYS )); then
              echo "::notice title=Heartbeat not needed::newest commit on ${BRANCH} is ${age_days} day(s) old (threshold ${HEARTBEAT_AFTER_DAYS})"
              echo "- heartbeat: not needed (newest commit ${age_days} day(s) old)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # An empty commit: the same tree as its parent, so no file in the repository changes.
            commit="$(git commit-tree "${head}^{tree}" -p "$head" -m "$msg" -m "$RUN_URL")"
            if g push -q origin "${commit}:refs/heads/${BRANCH}"; then
              echo "::notice title=Heartbeat::newest commit was ${age_days} day(s) old; pushed empty commit ${commit:0:7}"
              echo "- heartbeat: pushed empty commit ${commit:0:7} (newest commit was ${age_days} day(s) old)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::heartbeat push rejected (attempt $attempt); checking ${BRANCH} again"
            sleep $((attempt * 10))
          done
          echo "::error::could not push the heartbeat commit after 3 attempts"
          exit 1

      - name: Update the rolling alert issue
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          WBCHECK_OUTCOME: ${{ steps.wbcheck.outcome }}
          WBBUILD_OUTCOME: ${{ steps.wbbuild.outcome }}
          WBPUBLISH_OUTCOME: ${{ steps.wbpublish.outcome }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          GREEN_OUTCOMES: "PUBLISH SKIP HEARTBEAT WORKBOOK"
          CLOSING_OUTCOMES: "PUBLISH"
          DRY_RUN: ${{ steps.outcome.outputs.dry_run }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_DETAILS: ${{ runner.temp }}/nfl-alert-details.md
        run: |
          set -uo pipefail
          # CONTRACTS.md section 8 "Alerts": one issue per workflow (its own label). A red run opens or
          # comments on it. It is closed ONLY by a run of the same workflow that proves the problem is
          # gone (CLOSING_OUTCOMES, never in a dry run). Any other green result (a SKIP) leaves it alone.
          state=unchanged
          if [[ "$JOB_STATUS" != "success" || " $GREEN_OUTCOMES " != *" ${OUTCOME:-none} "* ]]; then
            state=red
          elif [[ " $CLOSING_OUTCOMES " == *" ${OUTCOME:-none} "* && "${DRY_RUN:-false}" != "true" ]]; then
            state=resolved
          fi
          echo "alert state: $state (outcome ${OUTCOME:-none}, job status $JOB_STATUS)"
          if [[ "$state" == "unchanged" ]]; then
            echo "::notice::${OUTCOME:-none} does not prove an earlier problem is gone; an open $ALERT_LABEL issue stays open"
            exit 0
          fi
          gh label create "$ALERT_LABEL" --color B60205 \
            --description "Automated alert from ${WORKFLOW_NAME}" --force >/dev/null \
            || echo "::warning::could not create or update label $ALERT_LABEL"
          # Only an issue opened by the workflow bot counts: anyone may open issues in a public repository.
          if ! num="$(gh issue list --label "$ALERT_LABEL" --state open --author app/github-actions \
                      --json number --jq '.[0].number // empty')"; then
            echo "::error::could not list issues (are issues enabled?)"
            exit 1
          fi
          if [[ "$state" == "red" ]]; then
            # Say what failed. A green pipeline result (SKIP, PUBLISH) with a red job means a step after it failed.
            what="${OUTCOME:-ERROR}"
            if [[ " $GREEN_OUTCOMES " == *" ${OUTCOME:-none} "* ]]; then
              what="a step after the pipeline failed"
              [[ "${COMMIT_OUTCOME:-}" == "failure" ]] && what="the data could not be committed to main"
              [[ "${HEARTBEAT_OUTCOME:-}" == "failure" ]] && what="the heartbeat commit could not be saved"
              [[ "${WBCHECK_OUTCOME:-}" == "failure" ]] && what="the workbook check failed"
              [[ "${WBBUILD_OUTCOME:-}" == "failure" ]] && what="the workbook could not be built"
              [[ "${WBPUBLISH_OUTCOME:-}" == "failure" ]] && what="the workbook could not be published"
              what="${what} (pipeline result ${OUTCOME})"
            fi
            body="**${WORKFLOW_NAME}** failed: **${what}**. Job status: ${JOB_STATUS}. Started by: ${EVENT:-unknown}, commit ${SHA:0:7}. Run: ${RUN_URL}"
            if [[ -s "${ALERT_DETAILS:-}" ]]; then
              body+=$'\n\n```text\n'"$(cat "$ALERT_DETAILS")"$'\n```'
            fi
            if [[ -n "$num" ]]; then
              gh issue comment "$num" --body "$body"
            else
              gh issue create --label "$ALERT_LABEL" --title "NFL pipeline needs attention: ${WORKFLOW_NAME}" \
                --body "$body"$'\n\n'"Every failing run of ${WORKFLOW_NAME} adds a comment here. Only a run of the same workflow that ends ${CLOSING_OUTCOMES} closes it; a SKIP leaves it open. What it means and how to clear it: ${GUIDE_URL}#alert-issues"
            fi
          elif [[ -n "$num" ]]; then
            gh issue close "$num" --comment "Resolved: ${WORKFLOW_NAME} ended ${OUTCOME} in ${RUN_URL}"
          else
            echo "no open $ALERT_LABEL issue to close"
          fi

      - name: Fail the run on HOLD or error
        if: steps.outcome.outputs.outcome != 'PUBLISH' && steps.outcome.outputs.outcome != 'SKIP' && steps.outcome.outputs.outcome != 'HEARTBEAT' && steps.outcome.outputs.outcome != 'WORKBOOK'
        env:
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
        run: |
          echo "::error::outcome ${OUTCOME:-unknown}: nothing was published"
          exit 1
